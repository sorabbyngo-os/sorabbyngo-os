set default=0
set timeout=3

menuentry "Sorabbyngo OS" {
    linux /boot/bzImage \
        root=/dev/sda1 \
        rw \
        quiet \
        loglevel=3 \
        console=tty1 \
        rd.systemd.show_status=false \
        sorabbyngo.env=prod
    initrd /boot/rootfs.cpio.gz
}

menuentry "Sorabbyngo OS (debug)" {
    linux /boot/bzImage \
        root=/dev/sda1 \
        rw \
        loglevel=7 \
        console=tty1 \
        console=ttyS0,115200 \
        sorabbyngo.env=dev
    initrd /boot/rootfs.cpio.gz
}

menuentry "Sorabbyngo OS (serial console)" {
    linux /boot/bzImage \
        root=/dev/sda1 \
        rw \
        console=ttyS0,115200 \
        panic=0 \
        sorabbyngo.env=lab
    initrd /boot/rootfs.cpio.gz
}

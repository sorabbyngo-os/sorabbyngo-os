[package]
name        = "byngoshell"
version     = "0.1.0"
edition     = "2021"
description = "ByngoShell — Sorabbyngo OS native CLI"

[[bin]]
name = "byngoshell"
path = "src/main.rs"

[dependencies]
reedline            = "=0.28.0"
serde               = { version = "=1.0.193", features = ["derive"] }
serde_json          = "=1.0.108"
sha2                = "=0.10.8"
hex                 = "=0.4.3"
chrono              = { version = "=0.4.31", default-features = false, features = ["clock"] }
indexmap            = "=2.1.0"
unicode-segmentation = "=1.10.1"
crossterm = "=0.27.0"

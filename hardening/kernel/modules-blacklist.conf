# ============================================================
# Sorabbyngo OS — Kernel Module Blacklist
# Disables unused/dangerous kernel modules
# ============================================================

# Uncommon network protocols — attack surface reduction
blacklist dccp
blacklist sctp
blacklist rds
blacklist tipc
blacklist n-hdlc
blacklist ax25
blacklist netrom
blacklist x25
blacklist rose
blacklist decnet
blacklist econet
blacklist af_802154
blacklist ipx
blacklist appletalk
blacklist psnap
blacklist p8023
blacklist p8022
blacklist can
blacklist atm

# Uncommon filesystems
blacklist cramfs
blacklist freevxfs
blacklist jffs2
blacklist hfs
blacklist hfsplus
blacklist squashfs
blacklist udf
blacklist cifs
blacklist nfs
blacklist nfsv3
blacklist nfsv4
blacklist gfs2

# Firewire — DMA attack vector
blacklist firewire-core
blacklist firewire-ohci
blacklist firewire-sbp2

# Thunderbolt — DMA attack vector (enabled per-device)
blacklist thunderbolt

# USB storage (enabled per-environment)
install usb-storage /bin/false

# Bluetooth (enabled per-environment)
blacklist bluetooth
blacklist btusb
blacklist bnep
blacklist rfcomm

# Webcam (enabled per-environment)
blacklist uvcvideo

# Vivid — known local privilege escalation vector
blacklist vivid

# Sorabbyngo OS — NATS Server Configuration

port: 4222
http_port: 8222
server_name: sorabbyngo-nats

jetstream {
  store_dir: /var/lib/sorabbyngo/nats
  max_memory_store: 512MB
  max_file_store:   4GB
}

log_file: /var/log/sorabbyngo/nats.log
logtime:  true
debug:    false

max_payload:     1MB
max_connections: 1000
write_deadline:  "2s"

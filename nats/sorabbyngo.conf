# Sorabbyngo NATS Server Configuration
port: 4222
http_port: 8222
server_name: "sorabbyngo-node"
log_file: "/var/log/sorabbyngo/nats.log"
logtime: true
debug: false
trace: false

jetstream {
    store_dir: "/var/lib/sorabbyngo/nats/jetstream"
    max_memory_store: 256MB
    max_file_store: 1GB
}

max_connections: 128
max_payload: 1MB
max_pending: 32MB
write_deadline: "3s"

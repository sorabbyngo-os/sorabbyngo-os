server_name: sorabbyngo-node
host: 0.0.0.0
port: 4222
http_port: 8222
jetstream {
    store_dir: /var/lib/sorabbyngo/nats
    max_memory_store: 256MB
    max_file_store: 2GB
}
log_file: /var/log/sorabbyngo/nats.log
logtime: true
accounts {
    SORABBYNGO {
        users: [
            { user: byngox,   password: $BYNGOX_NATS_PASSWORD   }
            { user: chameha,  password: $CHAMEHA_NATS_PASSWORD  }
            { user: novela,   password: $NOVELA_NATS_PASSWORD   }
            { user: cml,      password: $CML_NATS_PASSWORD      }
            { user: hal,      password: $HAL_NATS_PASSWORD      }
        ]
        jetstream: enabled
    }
}

[package]
name = "sorabbyngo-sys"
version = "0.1.0"
edition = "2021"
description = "Sorabbyngo system-level Rust bindings — hardware identity, seccomp, hardening APIs"
authors = ["Sorabbyngo Labs"]

[lib]
name = "sorabbyngo_sys"
crate-type = ["rlib", "staticlib"]

[dependencies]
thiserror  = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
libc       = "0.2"
nix        = { version = "0.29", features = ["process", "signal", "fs", "user"] }

[features]
default = ["seccomp"]
seccomp = []
selinux = []
